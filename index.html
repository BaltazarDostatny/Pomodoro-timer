<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>TIMER</header>

    <main>
        <div id="pomodoro">
            <ul>
                <li><button class="timeButtons">Pomodoro</button></li>
                <li><button class="timeButtons">Short Break</button></li>
                <li><button class="timeButtons">Long Break</button></li>
            </ul>

            <h1>00:00</h1>

            <ul>
                <li><button class="runButtons">START</button></li>
                <li><button class="runButtons">RESET</button></li>
            </ul>
        </div>
    </main>

    <script src="./main.js"></script>
</body>
</html>
